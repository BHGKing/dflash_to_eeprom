name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Tk and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk
          python -m pip install pytest
      - name: Run tests
        run: python -m pytest -q

  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install pyinstaller tkinterdnd2 pytest
      - name: Run tests
        run: python -m pytest -q
      - name: Build the single-file GUI
        run: pyinstaller --noconfirm --clean dflash_to_eee.spec
      - name: Check the executable exists
        shell: pwsh
        run: |
          $path = "dist/dflash_to_eee.exe"
          if (-not (Test-Path $path)) { throw "missing $path" }
          if ((Get-Item $path).Length -lt 1000000) { throw "executable looks too small" }
          Write-Host "Built $path ($((Get-Item $path).Length) bytes)"
      - uses: actions/upload-artifact@v4
        with:
          name: dflash-to-eee-windows
          path: dist/dflash_to_eee.exe
