name: Release

# Pushing a version tag (v1.0.0) builds the Windows executable and publishes
# a GitHub Release for that tag. workflow_dispatch rebuilds an existing tag.
# The exe is unsigned. Release notes start with a free-software callout and
# a "Verify your download" section (SHA-256, source tag and commit, this run).
# Authentication is the built-in GITHUB_TOKEN only.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to release, for example v1.0.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: "release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
  cancel-in-progress: false

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Resolve the version tag
        id: version
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if ($env:EVENT_NAME -eq "workflow_dispatch") {
            $tag = $env:INPUT_TAG.Trim()
          } else {
            $tag = $env:REF_NAME.Trim()
          }
          if ($tag -notmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$') {
            throw "Refusing '$tag'. Use a version tag such as v1.0.0."
          }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8NoBOM

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.version.outputs.tag }}

      - name: Record the checked-out commit
        id: source
        shell: pwsh
        run: |
          $sha = (git rev-parse HEAD).Trim().ToLower()
          if ($sha -notmatch '^[0-9a-f]{40}$') { throw "unexpected commit '$sha'" }
          "commit=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8NoBOM

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install pyinstaller tkinterdnd2 pytest

      - name: Run tests
        run: python -m pytest -q

      - name: Embed the release tag
        shell: pwsh
        env:
          DFLASH_RELEASE_TAG: ${{ steps.version.outputs.tag }}
          DFLASH_RELEASE_COMMIT: ${{ steps.source.outputs.commit }}
        run: python ci/release_publish.py embed

      - name: Check message catalogs are bundled by the spec
        shell: pwsh
        run: |
          foreach ($name in @("en.json", "es.json")) {
            $path = Join-Path (Get-Location) "dflash_eee\locales\$name"
            if (-not (Test-Path $path)) { throw "missing $path" }
          }
          $spec = Get-Content -Raw "dflash_to_eee.spec"
          if ($spec -notmatch "locales") { throw "dflash_to_eee.spec does not bundle the locales directory" }

      - name: Build the single-file GUI
        run: pyinstaller --noconfirm --clean dflash_to_eee.spec

      - name: Check the executable and write the checksum
        shell: pwsh
        run: |
          $exe = Join-Path (Get-Location) "dist\dflash_to_eee.exe"
          if (-not (Test-Path $exe)) { throw "missing $exe" }
          $length = (Get-Item $exe).Length
          if ($length -lt 1000000) { throw "executable looks too small ($length bytes)" }
          $hash = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLower()
          $sums = Join-Path (Get-Location) "dist\SHA256SUMS.txt"
          $utf8 = New-Object System.Text.UTF8Encoding $false
          [System.IO.File]::WriteAllText($sums, "$hash  dflash_to_eee.exe`n", $utf8)
          Write-Host "Built dist\dflash_to_eee.exe ($length bytes)"
          Write-Host "SHA256 $hash"

      - name: Publish the GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false
          $repo = $env:GITHUB_REPOSITORY
          $tag = $env:TAG
          gh release view $tag --repo $repo --json url,isDraft
          $exists = ($LASTEXITCODE -eq 0)
          $PSNativeCommandUseErrorActionPreference = $true

          $utf8 = New-Object System.Text.UTF8Encoding $false
          $sumsText = [System.IO.File]::ReadAllText((Join-Path (Get-Location) "dist\SHA256SUMS.txt"))
          $hash = ($sumsText.Trim() -split '\s+')[0].ToLower()
          if ($hash -notmatch '^[0-9a-f]{64}$') { throw "SHA256SUMS.txt has no SHA-256" }

          $generatedPath = Join-Path (Get-Location) "dist\generated-notes.md"
          $notesPath = Join-Path (Get-Location) "dist\RELEASE_NOTES.md"
          $body = "Release $tag."
          $PSNativeCommandUseErrorActionPreference = $false
          $rawLines = @(gh api --method POST "repos/$repo/releases/generate-notes" -f tag_name="$tag")
          $apiCode = $LASTEXITCODE
          $PSNativeCommandUseErrorActionPreference = $true
          if ($apiCode -eq 0 -and $rawLines.Count -gt 0) {
            try {
              $parsed = ($rawLines -join "`n") | ConvertFrom-Json
              if ($parsed.body) { $body = [string]$parsed.body }
            } catch {
              Write-Host "Using a short changelog because generate-notes did not return JSON."
            }
          } else {
            Write-Host "Using a short changelog because generate-notes failed."
          }
          [System.IO.File]::WriteAllText($generatedPath, $body, $utf8)

          python ci/release_publish.py notes --generated "$generatedPath" --output "$notesPath" --tag "$tag" --hash "$hash" --commit "$env:SOURCE_COMMIT" --run-id "$env:GITHUB_RUN_ID" --repository "$repo"
          if ($LASTEXITCODE -ne 0) { throw "could not compose release notes" }
          $notes = [System.IO.File]::ReadAllText($notesPath)
          if ($notes -notlike "*This software is free*") { throw "release notes are missing the free-software callout" }
          if ($notes -notlike "*Verify your download*") { throw "release notes are missing the verify section" }
          if ($notes -notlike "*$hash*") { throw "release notes are missing the SHA-256" }
          if ($notes -notlike "*Get-FileHash .\dflash_to_eee.exe -Algorithm SHA256*") { throw "release notes are missing the hash command" }

          if ($exists) {
            gh release upload $tag dist/dflash_to_eee.exe dist/SHA256SUMS.txt --repo $repo --clobber
            gh release edit $tag --repo $repo --notes-file "$notesPath"
          } else {
            $create = @("release", "create", $tag, "dist/dflash_to_eee.exe", "dist/SHA256SUMS.txt", "--repo", $repo, "--title", $tag, "--notes-file", $notesPath, "--verify-tag")
            if ($tag -match '-') { $create += "--prerelease" }
            & gh @create
          }
          gh release view $tag --repo $repo --json url,isDraft --jq "{url:.url,draft:.isDraft}"
