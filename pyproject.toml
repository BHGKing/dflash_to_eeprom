[project]
name = "dflash-to-eeprom"
version = "2.0.0"
description = "Rebuild an S12XE emulated EEPROM image from a D-Flash dump"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
authors = [
  { name = "Ben van Leeuwen Autotechniek" },
  { name = "Jose" },
]

[project.optional-dependencies]
gui = ["tkinterdnd2>=0.3.0"]
build = ["pyinstaller>=6", "tkinterdnd2>=0.3.0"]
test = ["pytest>=7"]

[project.scripts]
dflash-to-eeprom = "dflash_eee.cli:main"
dflash-to-eeprom-gui = "gui:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["gui", "dflash_to_eee"]

[tool.setuptools.packages.find]
include = ["dflash_eee*"]

[tool.setuptools.package-data]
dflash_eee = ["locales/*.json"]
